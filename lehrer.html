<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perlentaucher – Lehrerbereich</title>
<link rel="stylesheet" href="css/style.css?v=11">
<style>
  body { -webkit-user-select: text; user-select: text; }
  /* Die Kinder-App begrenzt #app auf 920px. Der Lehrerbereich
     braucht mehr Platz, sonst werden die Tabellen abgeschnitten. */
  #app { max-width: 1280px; }
  .lehrer { max-width: 1280px; margin: 0 auto; padding-bottom: 60px; }
  .lhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 10px; flex-wrap: wrap; }
  .lhead h1 { font-size: 26px; }
  .lhead .rechts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .reiter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .reiter button { padding: 12px 20px; border-radius: 14px 14px 0 0; background: #fff; border: 2px solid var(--line);
    border-bottom: none; font-weight: 800; font-size: 17px; color: var(--muted); min-height: 52px; }
  .reiter button.an { background: var(--brand); color: #fff; border-color: var(--brand); }

  .tabelle { width: 100%; border-collapse: collapse; font-size: 16px; }
  .tabelle th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
  .tabelle td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tabelle tr:last-child td { border-bottom: 0; }
  .tabelle .code { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .tabwrap { overflow-x: auto; -webkit-overflow-scrolling: touch;
    background:
      linear-gradient(90deg, #fff 30%, rgba(255,255,255,0)) left / 40px 100% no-repeat,
      linear-gradient(90deg, rgba(255,255,255,0), #fff 70%) right / 40px 100% no-repeat,
      radial-gradient(farthest-side at 0 50%, rgba(12,58,74,.14), transparent) left / 14px 100% no-repeat,
      radial-gradient(farthest-side at 100% 50%, rgba(12,58,74,.14), transparent) right / 14px 100% no-repeat;
    background-attachment: local, local, scroll, scroll; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }

  input[type=file] { font: inherit; font-size: 16px; padding: 10px 0; max-width: 100%; }
  input[type=text], input[type=number], select, textarea {
    border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit;
    font-size: 16px; color: var(--ink); background: #fff; max-width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
  textarea { width: 100%; min-height: 150px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; resize: vertical; }
  label.feld { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .klein { padding: 8px 8px; font-size: 15px; min-height: 44px; border-radius: 10px; max-width: 150px; }

  .btn.mini { min-height: 44px; padding: 8px 16px; font-size: 16px; border-bottom-width: 4px; min-width: 0; }
  .knopfreihe { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }

  .hinweis { background: var(--sand); color: var(--sand-ink); border-radius: 14px; padding: 12px 16px;
    font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .melden { border-radius: 14px; padding: 12px 16px; font-weight: 700; margin-top: 12px; }
  .melden.ok { background: var(--good-bg); color: var(--good-d); }
  .melden.fehler { background: var(--bad-bg); color: var(--bad-d); }
  .zahl { font-size: 32px; font-weight: 900; }

  .typen { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .typen label { display: flex; align-items: center; gap: 10px; background: #F4FAFD; border: 2px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font-weight: 700; cursor: pointer; }
  .typen input { width: 22px; height: 22px; accent-color: var(--brand); }

  .namensknopf { display: block; text-align: left; padding: 4px 8px 4px 0; border-radius: 8px; }
  .namensknopf b { display: block; font-size: 16px; }
  .namensknopf .code { display: block; }
  .namensknopf:hover b { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
  .muehe { list-style: none; margin: 0; padding: 0; counter-reset: m; }
  .muehe li { counter-increment: m; display: grid; align-items: center; gap: 6px 14px;
    grid-template-columns: 28px minmax(140px, 1fr) minmax(90px, 2fr) 60px auto; padding: 10px 0; }
  .muehe li + li { border-top: 1px solid var(--line); }
  .muehe li::before { content: counter(m); width: 28px; height: 28px; border-radius: 50%;
    background: var(--sand); color: var(--sand-ink); display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 900; }
  .mwort { font-weight: 800; font-size: 18px; }
  .mbar { display: block; height: 14px; background: var(--bad-bg); border-radius: 99px; overflow: hidden; }
  .mbar i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
  .mzahl { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .chips2 { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (max-width: 720px) {
    .muehe li { grid-template-columns: 28px 1fr; }
    .muehe .mbar, .muehe .mzahl { grid-column: 2; }
  }
  .malname { font-size: 19px; margin: 18px 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bildgalerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; margin-bottom: 8px; }
  .bildkarte { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px; margin: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bildkarte img { image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--line); }
  .bildkarte figcaption { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .bildkarte.fertig { border-color: var(--good); }
  @media print { .reiter, .lhead .rechts, .hinweis { display: none; } .bildkarte { break-inside: avoid; } }

  .merker { padding: 18px 0 8px; }
  .chip { display: inline-block; background: #E4F1F7; color: var(--brand-d); border-radius: 99px;
    padding: 4px 12px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .chip.aktiv { background: var(--good-bg); color: var(--good-d); }
</style>
</head>
<body>
<div id="app"><div class="lehrer"><p style="padding:40px 16px">Wird geladen …</p></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/config.js?v=11"></script>
<script src="js/words.js?v=11"></script>
<script src="js/mascot.js?v=11"></script>
<script src="js/icons.js?v=11"></script>
<script src="js/malen.js?v=11"></script>
<script src="js/cloud.js?v=11"></script>
<script>
/* ==========================================================
   Lehrerbereich
   Reiter: Fortschritt | Lernwörter | Einstellungen | Kinder
   Anmeldung mit Google. Wer in den Firestore-Regeln nicht als
   Lehrkraft eingetragen ist, sieht hier nichts.
   ========================================================== */
(function () {
  'use strict';
  var $app = document.getElementById('app');
  var auth, db, nutzer = null;
  var kinder = [], staende = {}, woerter = [], einst = {}, klassenPerlen = null;
  var reiter = 'fortschritt', filterListe = '', meldung = null;

  var TYPNAMEN = {
    buchstaben: 'Buchstaben ordnen', luecke: 'Fehlende Buchstaben', fehler: 'Richtige Schreibweise',
    artikel: 'Artikel zuordnen', silben_zaehlen: 'Silben zählen', silben_ordnen: 'Silben ordnen',
    trennen: 'Silben trennen', bild: 'Wort zum Bild', bedeutung: 'Bedeutung wählen', satz: 'Lückensatz'
  };
  var SPALTEN = ['wort', 'artikel', 'silben', 'trennung', 'wortart', 'gruppe', 'bild', 'bedeutung', 'satz', 'liste'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmtCode(c) { return c.slice(0, 4).toUpperCase() + '-' + c.slice(4).toUpperCase(); }
  function el(id) { return document.getElementById(id); }
  // Der letzte echte Übungstag steht in lastDay als "2026-09-20".
  // Nicht updatedAt nehmen: das ist nur der Zeitpunkt der letzten
  // Änderung am Datensatz und ändert sich auch beim Zurücksetzen.
  function letzterTag(f) {
    if (!f || !f.lastDay) return 'noch nie';
    var t = String(f.lastDay).split('-');
    if (t.length !== 3) return 'noch nie';
    return t[2].replace(/^0/, '') + '.' + t[1].replace(/^0/, '') + '.' + t[0];
  }
  function melde(text, art) { meldung = { text: text, art: art || 'ok' }; }

  if (typeof firebase === 'undefined') {
    $app.innerHTML = '<div class="lehrer"><div class="melden fehler" style="margin:40px 16px">' +
      'Firebase konnte nicht geladen werden. Bitte die Internetverbindung prüfen.</div></div>';
    return;
  }

  firebase.initializeApp(WA.firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();

  auth.onAuthStateChanged(function (u) {
    nutzer = u;
    if (!u) { zeigeAnmeldung(); return; }
    laden();
  });

  // ==========================================================
  //  Anmeldung
  // ==========================================================
  function zeigeAnmeldung() {
    $app.innerHTML = '<div class="center"><div class="cardbig">' + WA.mascot('think', 130) +
      '<h1>Lehrerbereich</h1>' +
      '<p>Melde dich mit dem Google-Konto an, das in den Firestore-Regeln eingetragen ist.</p>' +
      '<button class="btn big" id="google">Mit Google anmelden</button>' +
      '<a class="btn ghost big" href="index.html" style="text-decoration:none">Zurück zur App</a>' +
      '</div></div>';
    el('google').onclick = function () {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(function (e) { alert('Anmeldung nicht möglich: ' + (e && e.message)); });
    };
  }

  // ==========================================================
  //  Laden
  // ==========================================================
  function laden() {
    $app.innerHTML = '<div class="lehrer"><p style="padding:40px 16px">Daten werden geladen …</p></div>';
    Promise.all([
      db.collection('kinder').get(),
      db.collection('lernwoerter').get(),
      db.collection('einstellungen').doc('klasse').get(),
      db.collection('klassenwochen').doc(WA.cloud.wochenSchluessel()).get().catch(function () { return null; })
    ]).then(function (r) {
      kinder = [];
      r[0].forEach(function (d) { kinder.push(Object.assign({ id: d.id }, d.data())); });
      kinder.sort(function (a, b) { return String(a.vorname).localeCompare(String(b.vorname), 'de'); });

      woerter = [];
      r[1].forEach(function (d) { woerter.push(Object.assign({ id: d.id }, d.data())); });
      woerter.sort(function (a, b) { return String(a.wort).localeCompare(String(b.wort), 'de'); });

      einst = (r[2] && r[2].exists) ? r[2].data() : {};
      klassenPerlen = (r[3] && r[3].exists) ? (r[3].data().perlen || 0) : 0;

      return Promise.all(kinder.map(function (k) {
        return db.collection('fortschritt').doc(k.id).get()
          .then(function (f) { staende[k.id] = f.exists ? f.data() : null; })
          .catch(function () { staende[k.id] = null; });
      }));
    }).then(zeichnen).catch(zeigeFehler);
  }

  function zeigeFehler(e) {
    var keinZugriff = e && e.code === 'permission-denied';
    $app.innerHTML = '<div class="lehrer"><div class="lhead"><h1>Lehrerbereich</h1>' +
      '<button class="btn ghost" id="abmelden">Abmelden</button></div>' +
      '<div class="melden fehler">' + (keinZugriff
        ? 'Das Konto <b>' + esc(nutzer && nutzer.email) + '</b> ist in den Firestore-Regeln nicht als Lehrkraft ' +
          'eingetragen. Trag die Adresse in der Funktion istLehrer() ein und veröffentliche die Regeln erneut.'
        : 'Fehler beim Laden: ' + esc(e && e.message)) + '</div></div>';
    bindeKopf();
  }

  // ==========================================================
  //  Rahmen
  // ==========================================================
  function listenNamen() {
    var s = {};
    woerter.forEach(function (w) { if (w.liste) s[w.liste] = (s[w.liste] || 0) + 1; });
    return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, 'de'); })
      .map(function (n) { return { name: n, anzahl: s[n] }; });
  }

  function zeichnen() {
    var inhalt = reiter === 'woerter' ? tabWoerter()
      : reiter === 'einstellungen' ? tabEinstellungen()
      : reiter === 'kinder' ? tabKinder()
      : reiter === 'auswertung' ? tabAuswertung()
      : reiter === 'bilder' ? tabBilder()
      : reiter === 'sicherung' ? tabSicherung()
      : tabFortschritt();

    var m = meldung ? '<div class="melden ' + meldung.art + '">' + meldung.text + '</div>' : '';
    meldung = null;

    $app.innerHTML = '<div class="lehrer">' +
      '<div class="lhead"><h1>Lehrerbereich</h1><div class="rechts">' +
      '<span class="muted">' + esc(nutzer.email) + '</span>' +
      '<a class="btn ghost mini" href="index.html" style="text-decoration:none">Zur App</a>' +
      '<button class="btn ghost mini" id="abmelden">Abmelden</button></div></div>' +
      '<div class="reiter">' +
      knopf('fortschritt', 'Fortschritt') + knopf('auswertung', 'Auswertung') + knopf('woerter', 'Lernwörter (' + woerter.length + ')') +
      knopf('einstellungen', 'Einstellungen') + knopf('kinder', 'Kinder (' + kinder.length + ')') +
      knopf('bilder', 'Bilder') + knopf('sicherung', 'Sicherung') +
      '</div>' + m + inhalt + '</div>';

    bindeKopf();
    document.querySelectorAll('[data-reiter]').forEach(function (b) {
      b.onclick = function () { reiter = b.getAttribute('data-reiter'); zeichnen(); };
    });
    if (reiter === 'woerter') bindeWoerter();
    if (reiter === 'einstellungen') bindeEinstellungen();
    if (reiter === 'kinder') bindeKinder();
    if (reiter === 'fortschritt') bindeFortschritt();
    if (reiter === 'auswertung') bindeAuswertung();
    if (reiter === 'bilder') bindeBilder();
    if (reiter === 'sicherung') bindeSicherung();
  }

  function knopf(id, text) {
    return '<button data-reiter="' + id + '"' + (reiter === id ? ' class="an"' : '') + '>' + text + '</button>';
  }
  function bindeKopf() {
    var b = el('abmelden');
    if (b) b.onclick = function () { auth.signOut(); };
  }

  // ==========================================================
  //  Reiter 1: Fortschritt
  // ==========================================================
  function tabFortschritt() {
    var K = WA.config.klasse;
    var ziel = (einst.kinder || K.kinder) * (einst.wochenzielProKind || K.wochenzielProKind);
    var geuebt = kinder.filter(function (k) { return staende[k.id]; }).length;
    var listen = listenNamen();

    var zeilen = kinder.map(function (k) {
      var f = staende[k.id], ok = 0, wr = 0, sicher = 0;
      if (f && f.words) {
        Object.keys(f.words).forEach(function (id) {
          var w = f.words[id]; ok += w.ok || 0; wr += w.wr || 0;
          if ((w.ok || 0) >= (WA.config.masteredAfter || 3)) sicher++;
        });
      }
      var quote = (ok + wr) ? Math.round(ok / (ok + wr) * 100) + ' %' : '–';
      return '<tr><td><button class="namensknopf" data-reset="' + esc(k.id) + '" ' +
        'title="Fortschritt von ' + esc(k.vorname) + ' zurücksetzen"><b>' + esc(k.vorname) + '</b>' +
        '<span class="code">' + esc(fmtCode(k.id)) + '</span></button></td>' +
        '<td class="num">' + (f ? (f.xp || 0) : '–') + '</td>' +
        '<td class="num">' + (f ? (f.lessons || 0) : '–') + '</td>' +
        '<td class="num">' + quote + '</td>' +
        '<td class="num">' + (f ? sicher : '–') + '</td>' +
        '<td>' + stufenWahl(k) + '</td>' +
        '<td>' + listenWahl(k, listen) + '</td>' +
        '<td>' + letzterTag(f) + '</td></tr>';
    }).join('');

    return '<section class="stats">' +
      '<div class="card stat"><h3>Kinder freigeschaltet</h3><div class="zahl">' + kinder.length + '</div></div>' +
      '<div class="card stat"><h3>Davon schon geübt</h3><div class="zahl">' + geuebt + '</div></div>' +
      '<div class="card stat"><h3>Klassenziel diese Woche</h3><div class="zahl">' + klassenPerlen +
      ' <small style="font-size:15px;color:var(--muted)">/ ' + ziel + '</small></div></div></section>' +

      '<h2 class="sec">Fortschritt der Klasse</h2>' +
      '<div class="hinweis">Stufe und Liste gelten pro Kind. „wie Klasse“ bedeutet: die Einstellung ' +
      'aus dem Reiter Einstellungen. Änderungen wirken, sobald das Kind die App neu lädt.<br>' +
      'Auf einen <b>Namen</b> klicken, um den Fortschritt dieses Kindes zurückzusetzen.</div>' +
      '<section class="card"><div class="tabwrap"><table class="tabelle"><thead><tr>' +
      '<th>Kind</th><th>Perlen</th><th>Tauch&shy;gänge</th><th>Richtig</th><th>Sicher</th>' +
      '<th>Stufe</th><th>Liste</th><th>Zuletzt</th></tr></thead><tbody>' +
      (zeilen || '<tr><td colspan="8" class="muted">Noch keine Kinder freigeschaltet.</td></tr>') +
      '</tbody></table></div></section><div id="resetfeld"></div>';
  }

  function stufenWahl(k) {
    var opt = ['<option value="">wie Klasse</option>'].concat(
      Object.keys(WA.config.stufen).map(function (s) {
        return '<option value="' + s + '"' + (k.stufe === s ? ' selected' : '') + '>' + s + '</option>';
      })).join('');
    return '<select class="klein" data-kind="' + esc(k.id) + '" data-feld="stufe">' + opt + '</select>';
  }

  function listenWahl(k, listen) {
    var opt = ['<option value="">wie Klasse</option>'].concat(
      listen.map(function (l) {
        return '<option value="' + esc(l.name) + '"' + (k.liste === l.name ? ' selected' : '') +
          '>' + esc(l.name) + '</option>';
      })).join('');
    return '<select class="klein" data-kind="' + esc(k.id) + '" data-feld="liste">' + opt + '</select>';
  }

  function bindeFortschritt() {
    document.querySelectorAll('[data-reset]').forEach(function (b) {
      b.onclick = function () { resetFragen(b.getAttribute('data-reset')); };
    });
    document.querySelectorAll('[data-kind]').forEach(function (s) {
      s.onchange = function () {
        var id = s.getAttribute('data-kind'), feld = s.getAttribute('data-feld');
        var daten = {}; daten[feld] = s.value || null;
        s.disabled = true;
        db.collection('kinder').doc(id).set(daten, { merge: true })
          .then(function () {
            var k = kinder.filter(function (x) { return x.id === id; })[0];
            if (k) k[feld] = s.value || null;
            s.disabled = false;
          })
          .catch(function (e) { alert('Speichern fehlgeschlagen: ' + e.message); s.disabled = false; });
      };
    });
  }

  // ==========================================================
  //  Reiter 2: Lernwörter
  // ==========================================================
  function tabWoerter() {
    var listen = listenNamen();
    if (!woerter.length) {
      return '<section class="card"><h2 style="margin-bottom:10px">Noch keine Lernwörter in der Datenbank</h2>' +
        '<p class="muted" style="margin-bottom:14px">Die App benutzt gerade die ' + WA.words.length +
        ' mitgelieferten Merkwörter aus der Datei. Übernimm sie einmalig in die Datenbank, ' +
        'danach kannst du sie hier bearbeiten.</p>' +
        '<button class="btn" id="uebernehmen">Die ' + WA.words.length + ' Wörter übernehmen</button></section>';
    }

    var sichtbar = woerter.filter(function (w) { return !filterListe || w.liste === filterListe; });
    var zeilen = sichtbar.map(function (w, i) {
      return '<tr data-id="' + esc(w.id) + '">' +
        '<td>' + (w.bild ? '<span style="font-size:22px">' + esc(w.bild) + '</span>' : '') + '</td>' +
        '<td><b>' + esc((w.artikel ? w.artikel + ' ' : '') + w.wort) + '</b></td>' +
        '<td class="muted">' + esc(w.silben) + '</td>' +
        '<td class="muted">' + esc(w.trennung || w.silben) + '</td>' +
        '<td class="muted">' + esc(w.wortart) + '</td>' +
        '<td><span class="chip' + (w.liste === einst.aktiveListe ? ' aktiv' : '') + '">' + esc(w.liste || '–') + '</span></td>' +
        '<td style="white-space:nowrap">' +
        '<button class="btn ghost mini" data-bearbeiten="' + esc(w.id) + '">Ändern</button> ' +
        '<button class="btn ghost mini danger" data-loeschen="' + esc(w.id) + '">Löschen</button></td></tr>';
    }).join('');

    var filter = '<select class="klein" id="filter"><option value="">alle Listen (' + woerter.length + ')</option>' +
      listen.map(function (l) {
        return '<option value="' + esc(l.name) + '"' + (filterListe === l.name ? ' selected' : '') +
          '>' + esc(l.name) + ' (' + l.anzahl + ')</option>';
      }).join('') + '</select>';

    return '<section class="card">' +
      '<div class="knopfreihe" style="margin:0 0 14px">' + filter +
      '<button class="btn mini" id="neu">Neues Wort</button>' +
      '<button class="btn ghost mini" id="csvexport">Als CSV sichern</button>' +
      '<button class="btn ghost mini" id="csvimport">CSV einfügen</button></div>' +
      '<div class="tabwrap"><table class="tabelle"><thead><tr>' +

  function feld(id, label, wert) {

  function speichereWort(id) {
    var v = {}, fehler = [];
    SPALTEN.forEach(function (k) { var e = el('f_' + k); if (e) v[k] = e.value.trim(); });

    if (!v.wort) fehler.push('Das Wort fehlt.');
    if (v.artikel && ['der', 'die', 'das'].indexOf(v.artikel) < 0) fehler.push('Der Artikel muss der, die oder das sein.');
    if (!v.silben) v.silben = v.wort;
    if (v.silben.replace(/-/g, '') !== v.wort) fehler.push('Die Sprechsilben ergeben zusammen nicht das Wort. „' +
      v.silben.replace(/-/g, '') + '“ statt „' + v.wort + '“.');
    if (!v.trennung) v.trennung = v.silben;
    if (v.trennung.replace(/-/g, '') !== v.wort) fehler.push('Die Worttrennung ergibt zusammen nicht das Wort. „' +
      v.trennung.replace(/-/g, '') + '“ statt „' + v.wort + '“.');
    if (v.satz && v.satz.indexOf(v.wort) < 0) fehler.push('Das Wort kommt im Beispielsatz nicht genau so vor.');
    if (!v.liste) fehler.push('Die Liste fehlt.');

    var neueId = v.wort.toLowerCase();
    if (!id && woerter.some(function (x) { return x.id === neueId; })) fehler.push('Dieses Wort gibt es schon.');

    if (fehler.length) {
      el('formfehler').innerHTML = '<div class="melden fehler">' + fehler.map(esc).join('<br>') + '</div>';
      return;
    }

    var daten = { wort: v.wort, artikel: v.artikel || null, silben: v.silben, trennung: v.trennung, wortart: v.wortart,
                  gruppe: v.gruppe, bild: v.bild || null, bedeutung: v.bedeutung, satz: v.satz, liste: v.liste };
    var ziel = id || neueId;
    var p = db.collection('lernwoerter').doc(ziel).set(daten);
    if (id && id !== neueId) p = p.then(function () { return db.collection('lernwoerter').doc(id).delete(); });
    p.then(function () { melde('„' + esc(v.wort) + '“ gespeichert.'); laden(); })
     .catch(function (e) { el('formfehler').innerHTML = '<div class="melden fehler">' + esc(e.message) + '</div>'; });
  }

  // ---------- CSV ----------
  function csvExport() {
    var zeilen = [SPALTEN.join(';')].concat(woerter.map(function (w) {
      return SPALTEN.map(function (k) {
        var t = String(w[k] == null ? '' : w[k]);
        return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
      }).join(';');
    }));
    el('formular').innerHTML = '<h2 class="sec">CSV zum Sichern</h2><section class="card">' +
      '<div class="hinweis">Markieren, kopieren und in eine Textdatei oder Tabelle einfügen. ' +
      'Dieselbe Form kannst du über „CSV einfügen“ wieder zurückspielen.</div>' +
      '<textarea id="csvout" spellcheck="false" style="min-height:260px"></textarea>' +
      '<div class="knopfreihe"><button class="btn ghost" id="zu">Schließen</button></div></section>';
    el('csvout').value = zeilen.join('\n');
    el('csvout').select();
    el('zu').onclick = function () { el('formular').innerHTML = ''; };
  }

  function csvImportFormular() {
    el('formular').innerHTML = '<h2 class="sec">CSV einfügen</h2><section class="card">' +
      '<div class="hinweis">Erste Zeile sind die Spaltennamen, getrennt mit Semikolon:<br>' +
      '<b>' + SPALTEN.join(';') + '</b><br>' +
      'Vorhandene Wörter werden überschrieben, neue kommen dazu. Nichts wird gelöscht.</div>' +
      '<textarea id="csvin" spellcheck="false" placeholder="' + SPALTEN.join(';') + '&#10;Klee;der;Klee;Nomen;pflanze;🍀;eine Wiesenpflanze …;Im Gras wächst Klee.;Woche 5"></textarea>' +
      '<div class="knopfreihe"><button class="btn" id="csvgo">Einlesen</button>' +
      '<button class="btn ghost" id="zu">Abbrechen</button></div><div id="csvfehler"></div></section>';
    el('zu').onclick = function () { el('formular').innerHTML = ''; };
    el('csvgo').onclick = csvEinlesen;
  }

  function teileZeile(z) {
    var out = [], akt = '', inQ = false;
    for (var i = 0; i < z.length; i++) {
      var c = z[i];
      if (inQ) {
        if (c === '"' && z[i + 1] === '"') { akt += '"'; i++; }
        else if (c === '"') inQ = false;
        else akt += c;
      } else if (c === '"') inQ = true;
      else if (c === ';') { out.push(akt); akt = ''; }
      else akt += c;
    }
    out.push(akt);
    return out.map(function (t) { return t.trim(); });
  }

  function csvEinlesen() {
    var txt = el('csvin').value.replace(/\r/g, '').trim();
    var zeilen = txt.split('\n').filter(function (z) { return z.trim(); });
    if (zeilen.length < 2) { csvFehler(['Es fehlen Datenzeilen.']); return; }

    var kopf = teileZeile(zeilen[0]).map(function (t) { return t.toLowerCase(); });
    if (kopf.indexOf('wort') < 0) { csvFehler(['In der ersten Zeile fehlt die Spalte „wort“.']); return; }

    var gut = [], fehler = [];
    zeilen.slice(1).forEach(function (z, n) {
      var t = teileZeile(z), o = {};
      kopf.forEach(function (k, i) { if (SPALTEN.indexOf(k) >= 0) o[k] = t[i] || ''; });
      var zeile = 'Zeile ' + (n + 2) + ': ';
      if (!o.wort) { fehler.push(zeile + 'kein Wort'); return; }
      if (o.artikel && ['der', 'die', 'das'].indexOf(o.artikel) < 0) { fehler.push(zeile + 'Artikel „' + o.artikel + '“ ist ungültig'); return; }
      if (!o.silben) o.silben = o.wort;
      if (o.silben.replace(/-/g, '') !== o.wort) { fehler.push(zeile + 'Sprechsilben ergeben nicht „' + o.wort + '“'); return; }
      if (!o.trennung) o.trennung = o.silben;
      if (o.trennung.replace(/-/g, '') !== o.wort) { fehler.push(zeile + 'Worttrennung ergibt nicht „' + o.wort + '“'); return; }
      if (o.satz && o.satz.indexOf(o.wort) < 0) { fehler.push(zeile + 'Beispielsatz enthält „' + o.wort + '“ nicht'); return; }
      if (!o.liste) o.liste = einst.aktiveListe || 'Merkwörter 1';
      gut.push(o);
    });

    if (fehler.length) { csvFehler(fehler.concat(['', 'Es wurde nichts gespeichert.'])); return; }
    if (!gut.length) { csvFehler(['Keine gültigen Zeilen gefunden.']); return; }

    var batch = db.batch();
    gut.forEach(function (o) {
      batch.set(db.collection('lernwoerter').doc(o.wort.toLowerCase()), {
        wort: o.wort, artikel: o.artikel || null, silben: o.silben, trennung: o.trennung, wortart: o.wortart || '',
        gruppe: o.gruppe || '', bild: o.bild || null, bedeutung: o.bedeutung || '',
        satz: o.satz || '', liste: o.liste
      }, { merge: true });
    });
    batch.commit().then(function () { melde(gut.length + ' Wörter eingelesen.'); laden(); })
      .catch(function (e) { csvFehler([e.message]); });
  }

  function csvFehler(liste) {
    el('csvfehler').innerHTML = '<div class="melden fehler">' + liste.map(esc).join('<br>') + '</div>';
  }

  // ==========================================================
  //  Reiter: Pixelbilder
  //  Die Bilder liegen im Fortschritt des Kindes. Sie sind nur
  //  hier und für das Kind selbst sichtbar, nicht für die Klasse.
  // ==========================================================
  // Zeichnen und Speicherformat stecken in js/malen.js,
  // damit Kinder-App und Lehrerbereich dasselbe benutzen.
  function bildVorschau(b, px) { return WA.malen.vorschau(b, px); }

  // Die Bilder liegen in einer eigenen Sammlung. Sie werden je Kind
  // einzeln geholt, sonst würden bei 22 Kindern sehr viele Daten auf
  // einmal geladen.
  var bilderVon = {};        // code -> Liste von Bildern

  function tabBilder() {
    var bloecke = kinder.map(function (k) {
      var f = staende[k.id];
      var rest = (f && f.mal && f.mal.rest) || 0;
      var geladen = bilderVon[k.id];
      var inhalt;

      if (!geladen) {
        inhalt = '<button class="btn ghost mini" data-bilder="' + esc(k.id) + '">Bilder anzeigen</button>';
      } else if (geladen === 'laedt') {
        inhalt = '<p class="muted">Wird geladen …</p>';
      } else if (!geladen.length) {
        inhalt = '<p class="muted">Dieses Kind hat noch nichts gemalt.</p>';
      } else {
        inhalt = '<div class="bildgalerie">' + geladen.slice()
          .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); })
          .map(function (b) {
            var frei = b.art === 'frei';
            return '<figure class="bildkarte' + (b.fertig ? ' fertig' : '') + '">' +
              '<img src="' + bildVorschau(b, 120) + '" alt="' + (frei ? 'Zeichnung' : 'Pixelbild') + '" width="120" height="120">' +
              '<figcaption>' + (frei ? 'gezeichnet' : 'Pixel') + ' · ' + (b.fertig ? 'fertig' : 'in Arbeit') + '</figcaption></figure>';
          }).join('') + '</div>';
      }

      return '<h3 class="malname">' + esc(k.vorname) +
        ' <span class="chip">' + Math.round(rest / 60) + ' Min. Malzeit übrig</span></h3>' + inhalt;
    }).join('');

    return '<h2 class="sec">Bilder der Kinder</h2>' +
      '<div class="hinweis">Die Kinder bekommen für jedes erreichte Tagesziel ' +
      esc(String(WA.config.malen.minutenProZiel)) + ' Minuten Malzeit, höchstens ' +
      esc(String(WA.config.malen.maxGuthabenMinuten)) + ' Minuten Guthaben. ' +
      'Die Bilder sehen nur das Kind selbst und du. Zum Ausdrucken erst alle Bilder ' +
      'anzeigen lassen, dann diese Seite drucken.</div>' +
      '<div class="knopfreihe" style="margin-bottom:10px"><button class="btn ghost mini" id="allebilder">Alle Bilder anzeigen</button></div>' +
      (bloecke || '<section class="card"><p class="muted">Noch sind keine Kinder freigeschaltet.</p></section>');
  }

  function bilderHolen(code) {
    if (bilderVon[code]) return Promise.resolve();
    bilderVon[code] = 'laedt';
    zeichnen();
    return db.collection('bilder').where('code', '==', code).get()
      .then(function (snap) {
        var liste = [];
        snap.forEach(function (d) { liste.push(d.data()); });
        bilderVon[code] = liste;
        zeichnen();
      })
      .catch(function (e) {
        bilderVon[code] = [];
        melde('Bilder konnten nicht geladen werden: ' + esc(e.message) +
          (e.code === 'permission-denied'
            ? ' Wahrscheinlich sind die Firestore-Regeln noch nicht aktualisiert.' : ''), 'fehler');
        zeichnen();
      });
  }

  // ==========================================================
  //  Reiter: Auswertung
  //  Nicht "wer hat wie viel geübt", sondern "welche Wörter machen
  //  der Klasse Mühe". Gerechnet wird über alle Kinder zusammen.
  // ==========================================================
  var auswListe = '';          // Filter auf eine Wortliste

  function wortZahlen() {
    var sicherAb = WA.config.masteredAfter || 3;
    var proWort = {};
    woerter.forEach(function (w) {
      if (auswListe && w.liste !== auswListe) return;
      proWort[w.id] = { wort: w, kinder: 0, ok: 0, wr: 0, sicher: 0, unsicher: 0 };
    });
    kinder.forEach(function (k) {
      var f = staende[k.id];
      if (!f || !f.words) return;
      Object.keys(f.words).forEach(function (id) {
        var z = proWort[id];
        if (!z) return;
        var st = f.words[id], ok = st.ok || 0, wr = st.wr || 0;
        if (ok + wr === 0) return;
        z.kinder++; z.ok += ok; z.wr += wr;
        if (ok >= sicherAb) z.sicher++; else z.unsicher++;
      });
    });
    return Object.keys(proWort).map(function (id) {
      var z = proWort[id];
      z.antworten = z.ok + z.wr;
      z.quote = z.antworten ? z.ok / z.antworten : null;
      return z;
    });
  }

  function tabAuswertung() {
    var alle = wortZahlen();
    var geuebt = alle.filter(function (z) { return z.antworten > 0; });
    var offen = alle.filter(function (z) { return z.antworten === 0; });
    var listen = listenNamen();

    if (!geuebt.length) {
      return '<h2 class="sec">Auswertung</h2><section class="card"><p class="muted">' +
        'Noch hat niemand genug geübt, um etwas auswerten zu können.</p></section>';
    }

    var gesamtOk = geuebt.reduce(function (s, z) { return s + z.ok; }, 0);
    var gesamtWr = geuebt.reduce(function (s, z) { return s + z.wr; }, 0);

    // Für die Rangliste nur Wörter mit etwas Substanz. Ein Wort, das
    // ein einziges Kind einmal falsch hatte, sagt nichts über die Klasse.
    var muehe = geuebt.filter(function (z) { return z.antworten >= 4 && z.kinder >= 2 && z.wr > 0; })
      .sort(function (a, b) { return (a.quote - b.quote) || (b.wr - a.wr); })
      .slice(0, 10);

    var rang = muehe.length ? '<ol class="muehe">' + muehe.map(function (z) {
      return '<li><span class="mwort">' + esc(z.wort.wort) + '</span>' +
        '<span class="mbar"><i style="width:' + Math.round(z.quote * 100) + '%"></i></span>' +
        '<span class="mzahl">' + Math.round(z.quote * 100) + ' %</span>' +
        '<span class="muted">' + z.wr + ' Fehler bei ' + z.kinder + ' Kindern</span></li>';
    }).join('') + '</ol>'
      : '<p class="muted">Noch kein Wort, das mehreren Kindern Mühe macht. Das ist ein gutes Zeichen.</p>';

    var zeilen = geuebt.slice().sort(function (a, b) {
      return (a.quote - b.quote) || (b.wr - a.wr) ||
             String(a.wort.wort).localeCompare(String(b.wort.wort), 'de');
    }).map(function (z) {
      return '<tr><td><b>' + esc(z.wort.wort) + '</b>' +
        (z.wort.liste ? ' <span class="chip">' + esc(z.wort.liste) + '</span>' : '') + '</td>' +
        '<td class="num">' + z.kinder + '</td>' +
        '<td class="num">' + z.antworten + '</td>' +
        '<td class="num">' + z.wr + '</td>' +
        '<td class="num">' + Math.round(z.quote * 100) + ' %</td>' +
        '<td class="num">' + z.sicher + '</td>' +
        '<td class="num">' + z.unsicher + '</td></tr>';
    }).join('');

    return '<h2 class="sec">Was der Klasse Mühe macht</h2>' +
      '<div class="hinweis">Gerechnet über alle Kinder zusammen, ohne Namen. ' +
      'In der Rangliste stehen nur Wörter, die mindestens zwei Kinder und insgesamt ' +
      'mindestens viermal bearbeitet haben – ein einzelner Fehltipp soll die Liste nicht verzerren. ' +
      '<b>Sicher</b> heißt: ' + (WA.config.masteredAfter || 3) + ' mal richtig.</div>' +

      '<section class="stats">' +
      '<div class="card stat"><h3>Geübte Wörter</h3><div class="zahl">' + geuebt.length +
      '</div><div class="sub muted">von ' + alle.length + ' in der Liste</div></div>' +
      '<div class="card stat"><h3>Trefferquote der Klasse</h3><div class="zahl">' +
      Math.round(gesamtOk / (gesamtOk + gesamtWr) * 100) + ' %</div>' +
      '<div class="sub muted">' + (gesamtOk + gesamtWr) + ' Antworten</div></div>' +
      '<div class="card stat"><h3>Noch nicht geübt</h3><div class="zahl">' + offen.length +
      '</div><div class="sub muted">von keinem Kind angefasst</div></div>' +
      '</section>' +

      '<div class="knopfreihe"><label class="feld" style="flex-direction:row;align-items:center;gap:10px">' +
      'Wortliste <select id="auswfilter" class="klein"><option value="">alle</option>' +
      listen.map(function (l) {
        return '<option value="' + esc(l.name) + '"' + (auswListe === l.name ? ' selected' : '') + '>' +
          esc(l.name) + ' (' + l.anzahl + ')</option>';
      }).join('') + '</select></label></div>' +

      '<h2 class="sec">Die schwersten Wörter' + (muehe.length ? ' (' + muehe.length + ')' : '') +
      '</h2><section class="card">' + rang + '</section>' +

      (offen.length ? '<h2 class="sec">Noch nicht geübt</h2><section class="card"><div class="chips2">' +
        offen.slice(0, 60).map(function (z) { return '<span class="chip">' + esc(z.wort.wort) + '</span>'; }).join('') +
        (offen.length > 60 ? '<span class="muted"> … und ' + (offen.length - 60) + ' weitere</span>' : '') +
        '</div></section>' : '') +

      '<h2 class="sec">Alle geübten Wörter</h2><section class="card"><div class="tabwrap">' +
      '<table class="tabelle"><thead><tr><th>Wort</th><th>Kinder</th><th>Antworten</th>' +
      '<th>Fehler</th><th>richtig</th><th>sicher</th><th>noch nicht</th></tr></thead>' +
      '<tbody>' + zeilen + '</tbody></table></div></section>';
  }

  function bindeAuswertung() {
    var f = el('auswfilter');
    if (f) f.onchange = function () { auswListe = f.value; zeichnen(); };
  }

  // ==========================================================
  //  Reiter: Sicherung
  //  Firestore legt im kostenlosen Tarif keine Sicherungen an.
  //  Hier holst du dir alles als eine Datei und kannst sie
  //  zurückspielen. Wiederhergestellt wird nur, was in der Datei
  //  steht – nichts wird dabei gelöscht.
  // ==========================================================
  var SAMMLUNGEN = ['kinder', 'lernwoerter', 'einstellungen', 'klassenwochen', 'fortschritt', 'bilder'];
  var sicherungInhalt = null;      // eingelesene Datei, noch nicht geschrieben

  function tabSicherung() {
    var stand = sicherungInhalt;
    var pruefung = '';

    if (stand) {
      var zeilen = SAMMLUNGEN.map(function (c) {
        var n = (stand.daten && stand.daten[c] ? Object.keys(stand.daten[c]).length : 0);
        return '<tr><td>' + c + '</td><td class="num">' + n + '</td></tr>';
      }).join('');
      pruefung = '<h2 class="sec">Gelesene Datei</h2><section class="card">' +
        '<div class="hinweis">Gesichert am <b>' + esc(stand.erstellt || 'unbekannt') + '</b>' +
        (stand.mitBildern ? ' – mit Bildern.' : ' – ohne Bilder.') +
        '<br>Beim Zurückspielen werden diese Datensätze überschrieben. Datensätze, die es ' +
        'nur in der Datenbank gibt, bleiben unberührt. <b>Vorher am besten eine frische ' +
        'Sicherung herunterladen.</b></div>' +
        '<div class="tabwrap"><table class="tabelle"><thead><tr><th>Sammlung</th><th>Datensätze</th></tr></thead>' +
        '<tbody>' + zeilen + '</tbody></table></div>' +
        '<div class="knopfreihe"><button class="btn danger" id="spieleein">Jetzt zurückspielen</button>' +
        '<button class="btn ghost" id="verwerfen">Abbrechen</button></div>' +
        '<div id="einspielmeldung"></div></section>';
    }

    return '<h2 class="sec">Sicherung</h2>' +
      '<div class="hinweis">Firebase legt im kostenlosen Tarif <b>keine</b> Sicherungen an. ' +
      'Wenn hier etwas kaputtgeht, ist es weg. Lade dir deshalb regelmäßig – zum Beispiel ' +
      'am Ende jeder Woche – eine Sicherung herunter und leg sie zu deinen Unterlagen.</div>' +
      '<section class="card">' +
      '<div class="raster">' +
      '<div><b>Freigeschaltete Kinder:</b> ' + kinder.length + '<br>' +
      '<b>Lernwörter:</b> ' + woerter.length + '</div>' +
      '<div class="typen"><label><input type="checkbox" id="mitbildern" checked> ' +
      'Bilder der Kinder mitsichern</label></div>' +
      '</div>' +
      '<div class="knopfreihe"><button class="btn" id="sicherungab">Sicherung herunterladen</button></div>' +
      '<div id="sicherungmeldung"></div></section>' +

      '<h2 class="sec">Zurückspielen</h2><section class="card">' +
      '<div class="hinweis">Wähle eine zuvor heruntergeladene Datei. Du siehst erst, was darin ' +
      'steht, und entscheidest dann.</div>' +
      '<input type="file" id="sicherungdatei" accept="application/json,.json">' +
      '</section>' + pruefung;
  }

  function alleHolen(mitBildern) {
    var aufgaben = SAMMLUNGEN.filter(function (c) { return c !== 'bilder' || mitBildern; })
      .map(function (c) {
        return db.collection(c).get().then(function (snap) {
          var raus = {};
          snap.forEach(function (d) { raus[d.id] = d.data(); });
          return [c, raus];
        });
      });
    return Promise.all(aufgaben).then(function (teile) {
      var daten = {};
      teile.forEach(function (t) { daten[t[0]] = t[1]; });
      return daten;
    });
  }

  function sicherungHerunterladen() {
    var mitBildern = el('mitbildern').checked;
    var m = el('sicherungmeldung');
    m.innerHTML = '<div class="melden">Wird zusammengestellt …</div>';
    alleHolen(mitBildern).then(function (daten) {
      var jetzt = new Date();
      var stempel = jetzt.getFullYear() + '-' + ('0' + (jetzt.getMonth() + 1)).slice(-2) +
                    '-' + ('0' + jetzt.getDate()).slice(-2);
      var paket = { format: 'perlentaucher-sicherung', version: 1,
                    erstellt: jetzt.toLocaleString('de-DE'), mitBildern: mitBildern, daten: daten };
      var text = JSON.stringify(paket);
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = 'perlentaucher-sicherung-' + stempel + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      var anzahl = SAMMLUNGEN.reduce(function (s, c) {
        return s + (daten[c] ? Object.keys(daten[c]).length : 0); }, 0);
      m.innerHTML = '<div class="melden ok">Sicherung heruntergeladen: ' + anzahl +
        ' Datensätze, ' + Math.round(text.length / 1024) + ' KB.</div>';
    }).catch(function (e) {
      m.innerHTML = '<div class="melden fehler">Fehlgeschlagen: ' + esc(e.message) + '</div>';
    });
  }

  function dateiLesen(datei) {
    var leser = new FileReader();
    leser.onload = function () {
      try {
        var p = JSON.parse(leser.result);
        if (p.format !== 'perlentaucher-sicherung') throw new Error('Das ist keine Perlentaucher-Sicherung.');
        sicherungInhalt = p;
        melde('Datei gelesen. Schau dir unten an, was darin steht.');
      } catch (e) {
        sicherungInhalt = null;
        melde('Datei konnte nicht gelesen werden: ' + esc(e.message), 'fehler');
      }
      zeichnen();
    };
    leser.readAsText(datei);
  }

  // Firestore verkraftet 500 Schreibvorgänge je Paket.
  function inPaketenSchreiben(liste, fertig, m) {
    if (!liste.length) return Promise.resolve(fertig);
    var teil = liste.slice(0, 400), rest = liste.slice(400);
    var paket = db.batch();
    teil.forEach(function (x) { paket.set(db.collection(x.c).doc(x.id), x.daten); });
    return paket.commit().then(function () {
      fertig += teil.length;
      m.innerHTML = '<div class="melden">' + fertig + ' Datensätze geschrieben …</div>';
      return inPaketenSchreiben(rest, fertig, m);
    });
  }

  function zurueckspielen() {
    var m = el('einspielmeldung');
    var alles = [];
    SAMMLUNGEN.forEach(function (c) {
      var teil = sicherungInhalt.daten[c] || {};
      Object.keys(teil).forEach(function (id) { alles.push({ c: c, id: id, daten: teil[id] }); });
    });
    if (!alles.length) { m.innerHTML = '<div class="melden fehler">Die Datei enthält keine Datensätze.</div>'; return; }
    m.innerHTML = '<div class="melden">Wird zurückgespielt …</div>';
    inPaketenSchreiben(alles, 0, m).then(function (n) {
      sicherungInhalt = null;
      melde(n + ' Datensätze zurückgespielt.');
      bilderVon = {};
      laden();
    }).catch(function (e) {
      m.innerHTML = '<div class="melden fehler">Abgebrochen nach einem Fehler: ' + esc(e.message) +
        '<br>Es kann sein, dass ein Teil schon geschrieben wurde. Spiel die Datei noch einmal ein.</div>';
    });
  }

  function bindeSicherung() {
    el('sicherungab').onclick = sicherungHerunterladen;
    el('sicherungdatei').onchange = function () { if (this.files[0]) dateiLesen(this.files[0]); };
    var w = el('verwerfen');
    if (w) w.onclick = function () { sicherungInhalt = null; zeichnen(); };
    var s = el('spieleein');
    if (s) s.onclick = function () {
      if (s.getAttribute('data-sicher')) { zurueckspielen(); return; }
      s.setAttribute('data-sicher', '1');
      s.textContent = 'Wirklich überschreiben? Noch einmal tippen.';
    };
  }

  function bindeBilder() {
    document.querySelectorAll('[data-bilder]').forEach(function (b) {
      b.onclick = function () { bilderHolen(b.getAttribute('data-bilder')); };
    });
    var alle = el('allebilder');
    if (alle) alle.onclick = function () {
      kinder.forEach(function (k) { if (!bilderVon[k.id]) bilderHolen(k.id); });
    };
  }

  function bindeKinder() {
    el('importieren').onclick = importiereKinder;
    document.querySelectorAll('[data-reset]').forEach(function (b) {
      b.onclick = function () { resetFragen(b.getAttribute('data-reset')); };
    });
    document.querySelectorAll('[data-kindweg]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-kindweg');
        var k = kinder.filter(function (x) { return x.id === id; })[0];
        if (!confirm('Zugang von ' + k.vorname + ' sperren?\n\nDer Aufkleber funktioniert danach nicht mehr. ' +
          'Der Spielstand bleibt gespeichert und kommt zurück, wenn du denselben Code erneut freischaltest.')) return;
        db.collection('kinder').doc(id).delete()
          .then(function () { melde('Zugang von ' + esc(k.vorname) + ' gesperrt.'); laden(); })
          .catch(function (e) { alert('Fehler: ' + e.message); });
      };
    });
  }

  // ---------- Fortschritt zurücksetzen ----------
  // Es wird nicht gelöscht, sondern ein leerer Stand mit aktuellem
  // Zeitstempel geschrieben. Sonst würde das iPad des Kindes seinen
  // zwischengespeicherten Stand beim nächsten Start zurückschreiben.
  function wochenBeitrag(f) {
    if (!f || !f.days) return 0;
    var now = new Date(), dow = (now.getDay() + 6) % 7, summe = 0;
    for (var i = 0; i <= dow; i++) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      summe += f.days[k] || 0;
    }
    return summe;
  }

  function resetFragen(id) {
    var k = kinder.filter(function (x) { return x.id === id; })[0];
    if (!staende[id]) {
      melde(esc(k.vorname) + ' hat noch nie geübt, es gibt nichts zurückzusetzen.', 'fehler');
      zeichnen(); return;
    }
    var f = staende[id];
    var woerter = f.words ? Object.keys(f.words).length : 0;
    var abz = f.badges ? Object.keys(f.badges).length : 0;
    var feld = el('resetfeld');
    feld.innerHTML = '<h2 class="sec">' + esc(k.vorname) + ' zurücksetzen</h2><section class="card">' +
      '<div class="hinweis">Aktueller Stand: <b>' + (f.xp || 0) + ' Perlen</b>, ' +
      (f.lessons || 0) + ' Tauchgänge, ' + woerter + ' geübte Wörter, ' + abz + ' Abzeichen.<br>' +
      'Davon in dieser Woche: <b>' + wochenBeitrag(f) + ' Perlen</b>. Diese werden auch vom Klassenziel abgezogen.</div>' +
      '<div class="knopfreihe">' +
      '<button class="btn" data-tun="perlen" data-id="' + esc(id) + '">Nur die Perlen zurücksetzen</button>' +
      '<button class="btn bad" data-tun="alles" data-id="' + esc(id) + '">Alles zurücksetzen</button>' +
      '<button class="btn ghost" id="resetab">Abbrechen</button></div>' +
      '<p class="muted" style="margin-top:12px;font-size:15px">' +
      '<b>Nur die Perlen:</b> Perlen, Tagesziele und Rekorde gehen auf null. Welche Wörter schon ' +
      'sitzen und welche Abzeichen verdient sind, bleibt erhalten.<br>' +
      '<b>Alles:</b> Das Kind fängt bei null an, auch die Wortstatistik und die Abzeichen sind weg.</p>' +
      '<div id="resetmeldung"></div></section>';
    feld.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el('resetab').onclick = function () { feld.innerHTML = ''; };
    feld.querySelectorAll('[data-tun]').forEach(function (b) {
      b.onclick = function () { zuruecksetzen(b.getAttribute('data-id'), b.getAttribute('data-tun') === 'alles'); };
    });
  }

  function zuruecksetzen(id, alles) {
    var f = staende[id] || {}, woche = wochenBeitrag(f), jetzt = Date.now();
    var meld = el('resetmeldung');
    meld.innerHTML = '<div class="melden">Wird zurückgesetzt …</div>';

    var leer = { v: 1, hearts: WA.config.hearts.max, heartsAt: jetzt, xp: 0, xpGemeldet: 0, days: {},
                 best: { day: 0, lesson: 0 }, words: {}, badges: {}, lessons: 0, worlds: {},
                 lastDay: null, streakDays: 0, sound: true, updatedAt: jetzt };
    // Die gemalten Bilder liegen in einer eigenen Sammlung und
    // bleiben unberührt. Nur das Zeitguthaben wird auf null gesetzt.
    if (f.mal) { leer.mal = Object.assign({}, f.mal, { rest: 0, frisch: 0 }); }
    var neu = alles ? leer : Object.assign({}, f, {
      xp: 0, xpGemeldet: 0, days: {}, best: { day: 0, lesson: 0 }, updatedAt: jetzt });

    var p = Promise.resolve();
    if (woche > 0 && klassenPerlen !== null) {
      p = db.collection('klassenwochen').doc(WA.cloud.wochenSchluessel())
            .set({ perlen: Math.max(0, klassenPerlen - woche) }, { merge: true });
    }
    p.then(function () { return db.collection('fortschritt').doc(id).set(neu); })
     .then(function () {
       var k = kinder.filter(function (x) { return x.id === id; })[0];
       melde(esc(k.vorname) + ' zurückgesetzt' + (woche > 0 ? ', ' + woche + ' Perlen vom Klassenziel abgezogen.' : '.'));
       el('resetfeld').innerHTML = '';
       laden();
     })
     .catch(function (e) {
       meld.innerHTML = '<div class="melden fehler">Fehlgeschlagen: ' + esc(e.message) +
         (e.code === 'permission-denied'
           ? '<br>Wahrscheinlich sind die Firestore-Regeln noch nicht aktualisiert.' : '') + '</div>';
     });
  }

  function importiereKinder() {
    var erg = el('ergebnis'), txt = el('json').value.trim(), liste;
    try {
      liste = JSON.parse(txt);
      if (!Array.isArray(liste)) throw new Error('Es wird eine Liste erwartet.');
    } catch (e) {
      erg.innerHTML = '<div class="melden fehler">Die Datei konnte nicht gelesen werden: ' + esc(e.message) + '</div>';
      return;
    }

    var gut = [], schlecht = [];
    liste.forEach(function (k, i) {
      var code = String(k && k.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      var name = String(k && k.vorname || '').trim();
      if (!/^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{8}$/.test(code) || !name) schlecht.push(i + 1);
      else gut.push({ id: code.toLowerCase(), vorname: name });
    });

    if (schlecht.length) {
      erg.innerHTML = '<div class="melden fehler">Fehlerhafte Einträge an Position ' + schlecht.join(', ') +
        '. Es wurde nichts gespeichert.</div>';
      return;
    }

    erg.innerHTML = '<div class="melden">Wird gespeichert …</div>';
    var batch = db.batch();
    gut.forEach(function (k) {
      batch.set(db.collection('kinder').doc(k.id), { vorname: k.vorname, angelegt: Date.now() }, { merge: true });
    });
    batch.commit().then(function () { melde(gut.length + ' Kinder freigeschaltet.'); laden(); })
      .catch(function (e) { erg.innerHTML = '<div class="melden fehler">Speichern fehlgeschlagen: ' + esc(e.message) + '</div>'; });
  }
})();
</script>
</body>
</html>
