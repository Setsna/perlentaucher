<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Content Security Policy: Der Browser fuehrt nur Skripte aus den
     eigenen Dateien und von Firebase aus und spricht nur mit Firebase.
     Eingeschleuster Code (Inline-Skripte, Ereignis-Attribute, fremde
     Adressen) wird blockiert. Neue fremde Adresse = hier eintragen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perlentaucher">
<!-- Namensaufloesung und TLS zu den beiden Gegenstellen schon
     hier anstossen. Sonst faengt der Browser damit erst an,
     wenn er unten auf die Firebase-Skripte stoesst. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<meta name="theme-color" content="#0E7C86">
<!-- Geschlossene Schulanwendung. Sie soll nicht in Suchergebnissen
     auftauchen; die Adresse gibt es nur auf dem Aufkleber. -->
<meta name="robots" content="noindex, nofollow">
<title>Perlentaucher</title>
<link rel="stylesheet" href="css/style.css?v=60">
</head>
