<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Content Security Policy: Der Browser fuehrt nur Skripte aus den
     eigenen Dateien und von Firebase aus und spricht nur mit Firebase.
     Eingeschleuster Code (Inline-Skripte, Ereignis-Attribute, fremde
     Adressen) wird blockiert. Neue fremde Adresse = hier eintragen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perlentaucher">
<!-- Namensaufloesung und TLS zu den beiden Gegenstellen schon
     hier anstossen. Sonst faengt der Browser damit erst an,
     wenn er unten auf die Firebase-Skripte stoesst. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<meta name="theme-color" content="#0E7C86">
<!-- Geschlossene Schulanwendung. Sie soll nicht in Suchergebnissen
     auftauchen; die Adresse gibt es nur auf dem Aufkleber. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<title>Perlentaucher</title>
<link rel="stylesheet" href="css/style.css?v=75">
<!-- Vorlade-Liste (21.11.2026): Die CSP-Zeile oben schaltet das Vorausladen des Browsers ab.
     Ohne diese Liste kämen die Skripte einzeln nacheinander, jedes etwa 0,3 s.
     Für jedes eigene Skript dieser Seite steht hier eine Zeile mit genau derselben Adresse, auch dieselbe Nummer ?v=N.
     Kommt ein Skript dazu oder fällt eines weg: hier mit ändern. Firebase steht absichtlich nicht hier. -->
<link rel="preload" as="script" href="js/config.js?v=75">
<link rel="preload" as="script" href="js/words.js?v=75">
<link rel="preload" as="script" href="js/bilder.js?v=75">
<link rel="preload" as="script" href="js/quiz.js?v=75">
<link rel="preload" as="script" href="js/mascot.js?v=75">
<link rel="preload" as="script" href="js/icons.js?v=75">
<link rel="preload" as="script" href="js/malen.js?v=75">
<link rel="preload" as="script" href="js/merge.js?v=75">
<link rel="preload" as="script" href="js/exercises.js?v=75">
<link rel="preload" as="script" href="js/store.js?v=75">
<link rel="preload" as="script" href="js/cloud.js?v=75">
<link rel="preload" as="script" href="js/app.js?v=75">
</head>
<body class="meer">
<div id="app"></div>
<div id="modal"></div>
<!-- Firebase. Laedt die Seite ohne Netz, laeuft die App im Uebungsmodus weiter. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" integrity="sha384-ZaR6mWzmJtrRibZ1Vm7SoHFr8OXjyAuGAXalGDKqbxFT18oi/z+oZLIRFkpeNor1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" integrity="sha384-Ke0FJhH7LyRqDxZ0wt+/OXV38yfQVu7g9VPEEGjYmB4RVOY/ta04uecRhsMwT7V3" crossorigin="anonymous"></script>
<script src="js/config.js?v=75"></script>
<script src="js/words.js?v=75"></script>
<script src="js/bilder.js?v=75"></script>
<script src="js/quiz.js?v=75"></script>

</body>
</html>
